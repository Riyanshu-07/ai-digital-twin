<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Twin Avatar</title>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
            "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
        }
    }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            user-select: none;
        }

        /* ─── STAGE BACKGROUND & PEDESTAL ─── */
        #avatar-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 50% 88%, rgba(99,102,241,0.22) 0%, rgba(34,211,238,0.08) 35%, transparent 70%),
                radial-gradient(circle at 50% 35%, rgba(129,140,248,0.12), transparent 55%),
                linear-gradient(180deg, rgba(6,10,18,0.4) 0%, rgba(3,5,10,0.85) 100%);
        }

        /* Ambient Holographic Pedestal */
        .pedestal {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(99,102,241,0.3) 0%, rgba(34,211,238,0.15) 45%, transparent 75%);
            filter: blur(10px);
            pointer-events: none;
            z-index: 10;
            animation: pedestalPulse 4s ease-in-out infinite;
        }

        .pedestal-ring {
            position: fixed;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%) rotateX(75deg);
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 1px solid rgba(129,140,248,0.25);
            box-shadow: 0 0 15px rgba(99,102,241,0.3), inset 0 0 15px rgba(34,211,238,0.2);
            pointer-events: none;
            z-index: 10;
            animation: ringRotate 20s linear infinite;
        }

        @keyframes pedestalPulse {
            0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(0.95); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }

        @keyframes ringRotate {
            from { transform: translateX(-50%) rotateX(75deg) rotateZ(0deg); }
            to { transform: translateX(-50%) rotateX(75deg) rotateZ(360deg); }
        }

        /* ─── VIGNETTE & SCANLINES ─── */
        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.65);
        }

        .scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 21;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 3px, 6px 100%;
            opacity: 0.35;
        }

        /* ─── CORNER BRACKETS ─── */
        .bracket {
            position: fixed;
            width: 14px;
            height: 14px;
            pointer-events: none;
            z-index: 30;
            border-color: rgba(129,140,248,0.3);
            border-style: solid;
        }
        .bracket-tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
        .bracket-tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
        .bracket-bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; }
        .bracket-br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }

        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            position: relative;
            z-index: 5;
        }

        /* ─── STATUS BADGE ─── */
        #avatar-status {
            position: fixed;
            top: 18px;
            left: 20px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(5,9,18,0.85);
            border: 1px solid rgba(129,140,248,0.25);
            color: #a5b4fc;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.2px;
            backdrop-filter: blur(16px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #avatar-status.speaking {
            color: #38bdf8;
            border-color: rgba(56,189,248,0.45);
            background: rgba(8,20,38,0.9);
            box-shadow: 0 0 25px rgba(56,189,248,0.25);
        }

        #avatar-status.thinking {
            color: #c084fc;
            border-color: rgba(192,132,252,0.45);
            background: rgba(22,10,38,0.9);
            box-shadow: 0 0 25px rgba(192,132,252,0.25);
        }

        #avatar-status .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 10px currentColor;
            position: relative;
        }

        /* ─── VOICE BUTTON ─── */
        #voice-button {
            position: fixed;
            right: 20px;
            top: 18px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            border-radius: 999px;
            border: 1px solid rgba(129,140,248,0.3);
            background: linear-gradient(135deg, rgba(15,23,42,0.9) 0%, rgba(30,27,75,0.85) 100%);
            color: #e0e7ff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.8px;
            cursor: pointer;
            backdrop-filter: blur(16px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.1);
            transition: all .25s ease;
        }

        #voice-button:hover {
            background: linear-gradient(135deg, rgba(99,102,241,0.3) 0%, rgba(139,92,246,0.3) 100%);
            border-color: rgba(129,140,248,0.6);
            transform: translateY(-1px);
            box-shadow: 0 6px 25px rgba(99,102,241,0.35);
        }

        #voice-button:active {
            transform: translateY(0);
        }

        /* ─── BOTTOM HINT ─── */
        #avatar-hint {
            position: fixed;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            z-index: 40;
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(148,163,184,0.6);
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 1px;
            white-space: nowrap;
            pointer-events: none;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(6,10,18,0.4);
            border: 1px solid rgba(148,163,184,0.08);
            backdrop-filter: blur(8px);
        }
    </style>
</head>

<body>
    <div id="avatar-container"></div>
    <div class="pedestal"></div>
    <div class="pedestal-ring"></div>
    <div class="vignette"></div>
    <div class="scanlines"></div>

    <div class="bracket bracket-tl"></div>
    <div class="bracket bracket-tr"></div>
    <div class="bracket bracket-bl"></div>
    <div class="bracket bracket-br"></div>

    <div id="avatar-status">
        <span class="dot"></span>
        <span id="status-text">ONLINE</span>
    </div>

    <button id="voice-button">
        <span>🔊</span> ENABLE VOICE
    </button>

    <div id="avatar-hint">
        <span>✦</span> INTERACTIVE 3D PRESENCE <span>✦</span>
    </div>

    <script type="module" src="./avatar.js"></script>
</body>

</html>
